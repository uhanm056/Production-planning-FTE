# Po každém začlenění do main nasadí aplikaci na Firebase Hosting (https://<projekt>.web.app)
# spolu s pravidly Realtime Database z database.rules.json. Vlastní Firebase projekt (odděleně od MEC),
# zabezpečení a přihlášení stejné jako MEC. Potřebuje tajemství FIREBASE_SERVICE_ACCOUNT – postup v README.
# ID projektu: proměnná repozitáře FIREBASE_PROJECT (výchozí fte-plana, jako v .firebaserc).
name: Nasazení na Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sestavení webu
        run: |
          mkdir -p site
          cp index.html site/index.html
      - name: Chybí tajemství
        if: env.SA == ''
        run: echo "::warning::Tajemství FIREBASE_SERVICE_ACCOUNT není nastavené – web se nenasadil. Postup je v README (Online verze)."
      - uses: actions/setup-node@v4
        if: env.SA != ''
        with:
          node-version: "20"
      - name: Nasazení (hosting + pravidla databáze)
        if: env.SA != ''
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.29.1 deploy --only hosting,database --project "${{ vars.FIREBASE_PROJECT || 'fte-plana' }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
